version: 2

project_name: rexdiff

builds:
  - main: ./cmd/rexdiff
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [darwin]
    goarch: [arm64, amd64]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}-v{{ .Version }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: sha256sums.txt

changelog:
  use: github

# Add the files to the published GitHub release and keep its notes.
release:
  mode: keep-existing

# The release workflow gives GITHUB_TOKEN write access for Casks/rexdiff.rb.
homebrew_casks:
  - repository:
      owner: rednafi
      name: rexdiff
      branch: master
    directory: Casks
    homepage: https://github.com/rednafi/rexdiff
    description: Review the changes of a coding agent in Rex
    commit_author:
      name: Redowan Delowar
      email: redowan.nafi@gmail.com
    commit_msg_template: "Casks: rexdiff {{ .Tag }}"
    # Brew runs cask steps in a sandbox, with a fake HOME. So the cask
    # cannot add the Rex action. The caveat tells the user to do it.
    caveats: |
      Add the rexdiff action to Rex:
        rexdiff install
      Before brew uninstall rexdiff, remove it:
        rexdiff uninstall
    # The binary is not notarized. Without this, Gatekeeper blocks the
    # first run.
    hooks:
      post:
        install_steps: |
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/rexdiff"]
