name: release

# Publish a release on GitHub, for example with "gh release create v0.1.0".
# This workflow then adds the binaries to it and updates the cask.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # CI runs only on branches, so a release runs the tests again.
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # The tests in test/ time a real rexdiff. Beside the other packages
      # under -race, they get too little CPU and time out. So run them alone.
      - run: go test -race -count=1 $(go list ./... | grep -v '/test$')
      - run: go test -race -count=1 ./test

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # GoReleaser pushes Casks/rexdiff.rb to master.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
